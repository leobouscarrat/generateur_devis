[project]
name = "generateur-devis"
version = "0.1.0"
description = "Prototype de génération de devis tôlerie à partir de plans, et évaluation de l'extraction par IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generateur_devis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 : les descriptions des champs (envoyées au modèle) sont volontairement longues.
# UP046 : on garde Generic[T], la forme la plus éprouvée avec Pydantic.
ignore = ["E501", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
